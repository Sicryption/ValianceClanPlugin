plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	// Provided by the client at runtime - net.runelite:client depends on LWJGL at
	// compile scope for its own GPU plugin, so the classes resolve from our
	// classloader's parent. compileOnly, and the version is pinned to the one the
	// client ships: bundling a second copy would be a different GL binding than
	// the context we are reading from.
	compileOnly 'org.lwjgl:lwjgl:3.3.2'
	compileOnly 'org.lwjgl:lwjgl-opengl:3.3.2'

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.encryptiron'
version = '1.1.8'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release.set(11)
}
